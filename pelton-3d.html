<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Visor 3D - Banco Hidráulico F1-10 y Turbina Pelton F1-25-MKII</title>
<style>
  :root {
    --primary: #0f4c81;
    --accent: #f97316;
    --blue-hl: #0284c7;
    --bg-grad-top: #efefef;
    --bg-grad-bot: #d1d1d1;
    --card-bg: rgba(255, 255, 255, 0.96);
    --text-main: #1e293b;
    --text-muted: #64748b;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  #app-container {
    position: relative;
    width: 100%;
    max-width: 440px;
    height: 100vh;
    max-height: 860px;
    background: radial-gradient(
      ellipse at 50% 45%,
      var(--bg-grad-top) 0%,
      var(--bg-grad-top) 20%,
      var(--bg-grad-bot) 100%
    );
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }

  @media (min-width: 480px) {
    #app-container {
      height: 92vh;
      border-radius: 28px;
      border: 6px solid #334155;
    }
  }

  #app-container:fullscreen,
  #app-container:-webkit-full-screen {
    max-width: 100%;
    max-height: 100%;
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    border: none;
  }

  .header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
    pointer-events: none;
  }

  .header-left,
  .header-right {
    display: flex;
    gap: 6px;
    align-items: center;
    pointer-events: auto;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(6px);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    transition: all 0.2s;
    color: var(--text-main);
    font-weight: 700;
    font-size: 0.75rem;
  }

  .icon-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .icon-btn:active {
    transform: scale(0.94);
  }

  .pill-btn {
    padding: 7px 11px;
    border-radius: 20px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(6px);
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-main);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .pill-btn:hover {
    background: #fff;
  }

  .pill-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  #viewport {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
    outline: none;
  }

  #callout-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  #pins-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 12;
  }

  .pin {
    position: absolute;
    width: 28px;
    height: 28px;
    margin-left: -14px;
    margin-top: -14px;
    padding: 0;
    border-radius: 50%;
    background: #ffffff;
    color: var(--text-main);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.78rem;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
    border: 2px solid #cbd5e1;
    cursor: pointer;
    pointer-events: auto;
    transition:
      transform 0.2s,
      background 0.2s,
      color 0.2s,
      border-color 0.2s;
  }

  .pin:hover {
    transform: scale(1.1);
  }

  .pin.active {
    background: var(--accent);
    color: #fff;
    border-color: #fff;
    transform: scale(1.22);
    box-shadow:
      0 0 0 4px rgba(249, 115, 22, 0.35),
      0 4px 12px rgba(0, 0, 0, 0.3);
    z-index: 15;
  }

  .pin:focus-visible,
  button:focus-visible {
    outline: 3px solid #0284c7;
    outline-offset: 3px;
  }

  .anchor-dot {
    position: absolute;
    width: 9px;
    height: 9px;
    margin-left: -4.5px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: var(--primary);
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    pointer-events: none;
    transition: transform 0.2s, background 0.2s;
  }

  .anchor-dot.active {
    background: var(--accent);
    transform: scale(1.35);
  }

  .bottom-area {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 25;
    pointer-events: none;
  }

  .external-actions-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2px;
    pointer-events: none;
  }

  .ext-btn {
    pointer-events: auto;
    border: 1px solid rgba(255, 255, 255, 0.9);
    padding: 7px 14px;
    border-radius: 16px;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  }

  .ext-btn:active {
    transform: scale(0.95);
  }

  .lid-btn {
    background: rgba(255, 255, 255, 0.96);
    color: var(--primary);
  }

  .lid-btn.open {
    background: var(--primary);
    color: #ffffff;
    border-color: #38bdf8;
  }

  .flow-btn {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
  }

  .flow-btn.playing {
    background: #dc2626;
    box-shadow: 0 4px 14px rgba(220, 38, 38, 0.45);
  }

  .info-card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 0;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.8);
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .card-top-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 13px;
    border: none;
    border-radius: 16px;
    background: transparent;
    color: var(--primary);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .accordion-arrow {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    transition: transform 0.2s;
  }

  .card-top-row[aria-expanded="true"] .accordion-arrow {
    transform: rotate(180deg);
  }

  .card-details {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 0 13px 12px;
    max-height: 30vh;
    overflow-y: auto;
  }

  .card-details[hidden] {
    display: none;
  }

  .info-card h2 {
    font-size: 0.92rem;
    color: var(--primary);
    font-weight: 800;
    line-height: 1.2;
  }

  .info-capsule {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f1f5f9;
    border-radius: 12px;
    padding: 6px 9px;
    border: 1px solid rgba(0, 0, 0, 0.03);
  }

  .capsule-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 0.82rem;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    flex-shrink: 0;
  }

  .capsule-content {
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .capsule-label {
    font-size: 0.60rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .capsule-text {
    font-size: 0.74rem;
    font-weight: 400;
    color: var(--text-main);
    line-height: 1.22;
    user-select: text;
    -webkit-user-select: text;
  }

  .stepper {
    align-self: center;
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
    overflow: hidden;
    pointer-events: auto;
    border: 1px solid rgba(0, 0, 0, 0.06);
  }

  .stepper button {
    background: transparent;
    border: none;
    width: 36px;
    height: 28px;
    font-size: 0.9rem;
    font-weight: bold;
    color: var(--text-main);
    cursor: pointer;
    transition: background 0.15s;
  }

  .stepper button:hover {
    background: #f1f5f9;
  }

  .stepper span {
    padding: 0 12px;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-main);
    border-left: 1px solid #e2e8f0;
    border-right: 1px solid #e2e8f0;
  }

  #loading-screen {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(8px);
    z-index: 50;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
    padding: 30px;
    transition: opacity 0.4s ease;
  }

  #loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loader-spinner {
    width: 44px;
    height: 44px;
    border: 4px solid rgba(255, 255, 255, 0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 14px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loader-text {
    font-size: 0.88rem;
    font-weight: 600;
    color: #cbd5e1;
  }

  @media (max-height: 650px) {
    .bottom-area {
      gap: 4px;
      padding: 5px 9px 7px;
    }

    .card-top-row {
      padding: 10px;
    }

    .card-details {
      padding: 0 10px 9px;
      gap: 4px;
    }

    .info-capsule {
      padding: 4px 7px;
      gap: 6px;
    }

    .capsule-text { font-size: 0.68rem; }
    .capsule-label { font-size: 0.55rem; }
    .info-card h2 { font-size: 0.82rem; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="app-container">
  <div id="loading-screen">
    <div class="loader-spinner"></div>
    <div class="loader-text">Cargando Banco y Turbina Pelton 3D...</div>
  </div>

  <div class="header">
    <div class="header-left">
      <button class="pill-btn" id="btn-explode">💥 Explosionar</button>
      <button class="pill-btn" id="btn-toggle-pins">👁️ Pines</button>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="btn-reset-cam" title="Centrar vista 3D">3D</button>
      <button class="icon-btn" id="btn-fullscreen" title="Pantalla completa">⛶</button>
    </div>
  </div>

  <div id="viewport">
    <svg id="callout-svg"></svg>
    <div id="pins-layer"></div>
  </div>

  <div class="bottom-area">
    <div class="external-actions-row">
      <button class="ext-btn lid-btn" id="btn-open-lid">🔓 VER INTERIOR</button>
      <button class="ext-btn flow-btn" id="btn-anim-flow">ANIMAR FLUJO</button>
    </div>

    <div class="info-card" id="info-card">
      <h2>
        <button
          class="card-top-row"
          id="btn-accordion"
          type="button"
          aria-expanded="false"
          aria-controls="card-details"
        >
          <span id="part-title">1. Bastidor de soporte y canal superior</span>
          <svg
            class="accordion-arrow"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            aria-hidden="true"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
      </h2>

      <div class="card-details" id="card-details" hidden>
        <div class="info-capsule">
          <div class="capsule-icon">📍</div>
          <div class="capsule-content">
            <span class="capsule-label">Ubicación en la máquina</span>
            <span class="capsule-text" id="part-loc">
              Cubeta naranja y guías superiores del banco.
            </span>
          </div>
        </div>

        <div class="info-capsule">
          <div class="capsule-icon">⚙️</div>
          <div class="capsule-content">
            <span class="capsule-label">Para qué sirve</span>
            <span class="capsule-text" id="part-func">
              Sostiene la unidad de turbina alineada y conduce el retorno
              de agua por gravedad hacia el tanque.
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="stepper">
      <button id="btn-prev">❮</button>
      <span id="step-counter">1 / 7</span>
      <button id="btn-next">❯</button>
    </div>
  </div>
</div>

<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
  import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

  const MODEL_URL =
    "https://alexcau-source.github.io/T-Vilab/banco_y_turbina_pelton.glb";

  const PARTS_DATA = [
    {
      id: 1,
      name: "Bastidor de soporte y canal superior",
      role: "yellow_table",
      nodes: ["Cubeta_Superior_Naranja"],
      anchorNode: "Cubeta_Superior_Naranja",
      offset: [-0.30, 0.98, 0.32],
      color: 0x0284c7,
      loc: "Cubeta naranja y guías superiores del banco.",
      func: "Sostiene el accesorio de ensayo y recoge el agua descargada para conducirla hacia la medición y el retorno al depósito.",
      direction: [1, 1.1, 1.7]
    },
    {
      id: 2,
      name: "Conjunto de turbina Pelton y bastidor",
      role: "turbine_assembly",
      nodes: ["Turbina_Pelton"],
      anchorNode: "Turbina_Pelton",
      offset: [0.08, 0.30, 0],
      color: 0xf97316,
      loc: "Módulo instalado sobre la placa blanca del banco.",
      func: "Reúne la carcasa con protector frontal, el rodete, la boquilla, el bastidor de columnas y los instrumentos del ensayo.",
      direction: [0.5, 0.4, 1.8]
    },
    {
      id: 3,
      name: "Rodete Pelton de 24 cucharillas",
      role: "pelton_wheel",
      nodes: ["Rotor_Pelton_24_Cucharillas"],
      anchorNode: "Rotor_Pelton_24_Cucharillas",
      offset: [0, 0, 0.026],
      color: 0xf97316,
      loc: "Eje central, detrás del protector frontal transparente.",
      func: "El chorro transmite impulso a las cucharillas y produce el giro del rodete. La rueda representada tiene un diámetro nominal de 130 mm y 24 cucharillas.",
      direction: [0.15, 0.20, 1.9]
    },
    {
      id: 4,
      name: "Válvula de lanza y tobera",
      role: "spear_valve",
      nodes: ["Boquilla_y_Valvula_de_Lanza"],
      anchorNode: "Boquilla_y_Valvula_de_Lanza",
      offset: [0.032, 0, 0.016],
      color: 0xf97316,
      loc: "Entrada inferior izquierda de la carcasa, conectada a la manguera transparente.",
      func: "La lanza regula la abertura de salida y el caudal. La tobera dirige un chorro compacto hacia las cucharillas del rodete.",
      direction: [-0.7, 0.35, 1.8]
    },
    {
      id: 5,
      name: "Manómetro de presión de entrada",
      role: "manometer",
      nodes: ["Manometro_Presion_Entrada"],
      anchorNode: "Manometro_Presion_Entrada",
      offset: [0, 0, 0.021],
      color: 0xf97316,
      loc: "Soporte lateral izquierdo de las columnas de la turbina.",
      func: "En el equipo físico indica la presión de suministro antes de la boquilla. La carátula de este modelo es ilustrativa y no proporciona una medición en tiempo real.",
      direction: [-0.4, 0.25, 1.9]
    },
    {
      id: 6,
      name: "Dinamómetros y freno de banda",
      role: "dynamometer",
      nodes: [
        "Freno_y_Dos_Dinamometros",
        "Tornillo_Ajuste_Carga",
        "Eje_y_Tambor_Freno"
      ],
      anchorNode: "Freno_y_Dos_Dinamometros",
      offset: [0, 0.43, -0.055],
      color: 0xf97316,
      loc: "Dos básculas suspendidas del travesaño y banda situada detrás del rodete.",
      func: "En el ensayo físico, la diferencia de tensión entre las básculas permite determinar el par de frenado. Con la velocidad de giro se calcula la potencia mecánica. El tornillo superior permite ajustar la carga.",
      direction: [0.25, 0.25, 1.9]
    },
    {
      id: 7,
      name: "Banco hidráulico, depósito y medición volumétrica",
      role: "hydraulic_bench_tank",
      nodes: ["Banco_Hidraulico_F1_10"],
      anchorNode: "Bomba_Recirculacion_025kW",
      offset: [0, 0.055, 0.05],
      color: 0xf97316,
      requiresInterior: true,
      loc: "Depósito y bomba en el interior inferior; tanque de medición en la cubeta superior.",
      func: "El banco almacena agua en el depósito nominal de 250 L y la recircula con una bomba de 0,25 kW. La medición volumétrica utiliza las secciones de 6 L y 40 L. El frente se separa aquí como corte didáctico, no como una tapa real.",
      direction: [0.22, 0.12, 1.8]
    }
  ];

  const viewport = document.getElementById("viewport");
  const svgLayer = document.getElementById("callout-svg");
  const pinsLayer = document.getElementById("pins-layer");
  const container = document.getElementById("app-container");
  const loadingScreen = document.getElementById("loading-screen");

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 50);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
  });

  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  viewport.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.maxPolarAngle = Math.PI / 2 + 0.08;
  controls.minDistance = 0.18;
  controls.maxDistance = 12;

  scene.add(
    new THREE.HemisphereLight(0xffffff, 0x94a3b8, 1.6)
  );

  for (const [pos, intensity, color] of [
    [[4, 6, 5], 2.2, 0xffffff],
    [[-4, 3, -3], 1.2, 0xdbeafe]
  ]) {
    const light = new THREE.DirectionalLight(color, intensity);
    light.position.set(...pos);
    scene.add(light);
  }

  let machineRoot = null;
  let mixer = null;
  let currentPartIndex = 0;
  let isFlowPlaying = false;
  let isExploded = false;
  let isLidOpen = false;
  let pinsVisible = true;
  let camAnim = null;
  let cameraFrame = null;
  let lastLayout = "";
  let waterParticles = null;
  let frontPanel = null;
  let openPanelPosition = null;

  const actions = {};
  const roleMeshes = {};
  const baseMaterials = new Map();
  let highlightMaterials = [];

  const parts = PARTS_DATA;
  const btnLid = document.getElementById("btn-open-lid");
  const btnFlow = document.getElementById("btn-anim-flow");
  const btnExplode = document.getElementById("btn-explode");

  const pinElements = parts.map((part, index) => {
    const pin = document.createElement("button");
    pin.type = "button";
    pin.className = "pin";
    pin.textContent = part.id;
    pin.setAttribute("aria-label", `${part.id}. ${part.name}`);
    pin.title = part.name;

    pin.addEventListener("click", (event) => {
      event.stopPropagation();
      selectPart(index, true);
    });

    pinsLayer.appendChild(pin);

    const dot = document.createElement("div");
    dot.className = "anchor-dot";
    pinsLayer.appendChild(dot);

    const line = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );

    svgLayer.appendChild(line);

    return { pin, dot, line, part };
  });

  function getMeshes(node) {
    const result = [];

    node?.traverse((child) => {
      if (child.isMesh) result.push(child);
    });

    return result;
  }

  function addBankShadow(bounds) {
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = 256;

    const context = canvas.getContext("2d");
    const gradient = context.createRadialGradient(
      128, 128, 12,
      128, 128, 128
    );

    gradient.addColorStop(0, "rgba(0, 0, 0, 0.30)");
    gradient.addColorStop(0.4, "rgba(0, 0, 0, 0.20)");
    gradient.addColorStop(0.75, "rgba(0, 0, 0, 0.07)");
    gradient.addColorStop(1, "rgba(0, 0, 0, 0)");

    context.fillStyle = gradient;
    context.fillRect(0, 0, 256, 256);

    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());

    const shadow = new THREE.Mesh(
      new THREE.PlaneGeometry(size.x * 1.45, size.z * 1.65),
      new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(canvas),
        transparent: true,
        depthWrite: false,
        toneMapped: false
      })
    );

    shadow.name = "Sombra_suave_del_banco";
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.set(
      center.x,
      bounds.min.y - 0.006,
      center.z
    );

    // Fuera del modelo para conservar los encuadres y la selección.
    scene.add(shadow);
  }

  function improveBankInterior() {
    // Dibujar también las caras interiores de las paredes del banco.
    const shell = machineRoot.getObjectByName(
      "Carcasa_Blanca_Moldeada"
    );

    shell?.traverse((child) => {
      if (!child.isMesh) return;

      const adjust = (material) => {
        const copy = material.clone();
        copy.side = THREE.DoubleSide;

        if (copy.name.includes("polietileno")) {
          copy.color.setHex(0xdddddd);
          copy.roughness = 0.65;
        }

        return copy;
      };

      child.material = Array.isArray(child.material)
        ? child.material.map(adjust)
        : adjust(child.material);
    });

    const pipe = machineRoot.getObjectByName(
      "Tuberia_Interna_de_Impulsion"
    );

    pipe?.traverse((child) => {
      if (!child.isMesh) return;

      const adjust = (material) => {
        const copy = material.clone();
        copy.color.setHex(0x666666);
        copy.opacity = 0.85;
        copy.roughness = 0.55;
        copy.depthWrite = false;
        return copy;
      };

      child.material = Array.isArray(child.material)
        ? child.material.map(adjust)
        : adjust(child.material);
    });
  }

  function bindParts() {
    improveBankInterior();

    machineRoot.traverse((child) => {
      if (child.isMesh) {
        baseMaterials.set(child, child.material);
      }
    });

    for (const part of parts) {
      part.groups = part.nodes
        .map((name) => machineRoot.getObjectByName(name))
        .filter(Boolean);

      part.anchor = machineRoot.getObjectByName(part.anchorNode);

      if (
        !part.anchor ||
        part.groups.length !== part.nodes.length
      ) {
        throw Error(
          `No se encuentra el componente del pin ${part.id}: ${part.name}`
        );
      }

      roleMeshes[part.role] = [
        ...new Set(part.groups.flatMap(getMeshes))
      ];

      // Guardar el encuadre antes de desplazar el frente del banco.
      part.focusBounds = new THREE.Box3();

      part.groups.forEach((group) => {
        part.focusBounds.expandByObject(group);
      });
    }
  }

  function anchorWorld(part) {
    return part.anchor.localToWorld(
      new THREE.Vector3(...part.offset)
    );
  }

  function highlightPart(part) {
    baseMaterials.forEach((material, mesh) => {
      mesh.material = material;
    });

    highlightMaterials.forEach((material) => material.dispose());
    highlightMaterials = [];

    for (const mesh of roleMeshes[part.role] || []) {
      const original = baseMaterials.get(mesh);

      const tint = (material) => {
        const copy = material.clone();
        highlightMaterials.push(copy);

        if (copy.emissive) {
          copy.emissive.setHex(part.color);
          copy.emissiveIntensity = 0.22;
        }

        return copy;
      };

      mesh.material = Array.isArray(original)
        ? original.map(tint)
        : tint(original);
    }
  }

  function usableFrame() {
    const width = viewport.clientWidth;
    const height = viewport.clientHeight;

    const bottom = document
      .querySelector(".bottom-area")
      .getBoundingClientRect().height;

    const headerHeight = document
      .querySelector(".header")
      .getBoundingClientRect().height;

    const top = Math.min(
      pinsVisible
        ? Math.max(108, headerHeight + 12)
        : headerHeight + 12,
      height * 0.35
    );

    const reservedBottom = bottom + 10;

    return {
      width,
      height,
      top,
      bottom: reservedBottom,
      usableHeight: Math.max(
        1,
        height - top - reservedBottom
      )
    };
  }

  function fitCamera(box, direction, immediate = false) {
    cameraFrame = {
      box: box.clone(),
      direction: [...direction]
    };

    const frame = usableFrame();
    const size = box.getSize(new THREE.Vector3());
    const target = box.getCenter(new THREE.Vector3());
    const dir = new THREE.Vector3(...direction).normalize();

    const right = new THREE.Vector3()
      .crossVectors(dir, new THREE.Vector3(0, 1, 0))
      .normalize();

    const up = new THREE.Vector3()
      .crossVectors(right, dir)
      .normalize();

    const extent = (vector) =>
      Math.abs(vector.x) * size.x +
      Math.abs(vector.y) * size.y +
      Math.abs(vector.z) * size.z;

    const verticalFov = THREE.MathUtils.degToRad(camera.fov);
    const tan = Math.tan(verticalFov / 2);

    const distance = Math.max(
      extent(up) /
        (2 * tan * (frame.usableHeight / frame.height)),
      extent(right) /
        (2 * tan * camera.aspect * 0.82)
    ) + 0.5 * extent(dir);

    const end = target
      .clone()
      .addScaledVector(
        dir,
        Math.max(0.28, distance * 1.10)
      );

    if (immediate) {
      camera.position.copy(end);
      controls.target.copy(target);
      camAnim = null;
      controls.update();
    } else {
      camAnim = {
        startPos: camera.position.clone(),
        endPos: end,
        startLook: controls.target.clone(),
        endLook: target,
        progress: 0
      };
    }
  }

  function assembledBounds() {
    return machineRoot.userData.assembledBounds.clone();
  }

  function focusPart(part, immediate = false) {
    const box = part.id === 7
      ? part.focusBounds.clone()
      : new THREE.Box3();

    if (part.id !== 7) {
      part.groups.forEach((group) => {
        box.expandByObject(group);
      });
    }

    const isSmallPart = [3, 4, 5].includes(part.id);
    box.expandByScalar(isSmallPart ? 0.025 : 0.015);

    fitCamera(box, part.direction, immediate);
  }

  function ui() {
    const interiorLocked = Boolean(
      parts[currentPartIndex].requiresInterior
    );

    if (interiorLocked) isLidOpen = true;

    btnLid.disabled = interiorLocked;
    btnLid.title = interiorLocked
      ? "El interior permanece abierto en el paso 7"
      : "";

    btnLid.classList.toggle("open", isLidOpen);

    btnLid.textContent = interiorLocked
      ? "🔓 INTERIOR ABIERTO"
      : isLidOpen
        ? "🔒 CERRAR INTERIOR"
        : "🔓 VER INTERIOR";

    btnFlow.classList.toggle("playing", isFlowPlaying);
    btnFlow.textContent = isFlowPlaying
      ? "DETENER FLUJO"
      : "ANIMAR FLUJO";

    btnExplode.classList.toggle("active", isExploded);
    btnExplode.textContent = isExploded
      ? "💥 Ensamblar"
      : "💥 Explosionar";

    if (waterParticles) {
      waterParticles.visible = !isExploded;
    }
  }

  function resetActions() {
    mixer.stopAllAction();
    isFlowPlaying = false;
    isLidOpen = false;
    isExploded = false;
    ui();
  }

  function once(name) {
    const action = actions[name];

    if (!action) {
      throw Error(`Falta el clip integrado: ${name}`);
    }

    action.reset().setLoop(THREE.LoopOnce, 1);
    action.clampWhenFinished = true;
    action.play();

    return action;
  }

  function setInterior(open, immediate = false) {
    if (!machineRoot) return;

    if (parts[currentPartIndex].requiresInterior) {
      open = true;
    }

    if (isExploded) resetActions();

    if (open === isLidOpen && !immediate) return;

    actions.Abrir_Corte_Banco?.stop();
    actions.Cerrar_Corte_Banco?.stop();

    isLidOpen = open;

    const action = once(
      open ? "Abrir_Corte_Banco" : "Cerrar_Corte_Banco"
    );

    if (immediate) {
      action.time = action.getClip().duration;
      mixer.update(0);
    }

    ui();
  }

  function setFlow(playing) {
    if (!machineRoot) return;

    if (playing && isExploded) {
      resetActions();
    }

    const action = actions.Funcionamiento_Con_Agua;

    if (!action) {
      throw Error(
        "El GLB no contiene Funcionamiento_Con_Agua."
      );
    }

    isFlowPlaying = playing;

    if (playing) {
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.play();
      action.paused = false;
    } else {
      action.paused = true;
    }

    ui();
  }

  function setExploded(exploded) {
    if (!machineRoot) return;

    if (exploded) {
      resetActions();
      isExploded = true;
      once("Vista_Explosionada");

      fitCamera(
        assembledBounds().expandByVector(
          new THREE.Vector3(0.6, 0.3, 0.3)
        ),
        [1, 0.65, 1.8]
      );
    } else {
      actions.Vista_Explosionada?.stop();
      isExploded = false;
      once("Reensamblar");
      fitCamera(assembledBounds(), [1, 0.65, 1.8]);
    }

    ui();
  }

  function selectPart(index, fly = true) {
    const wasInteriorStep = Boolean(
      parts[currentPartIndex].requiresInterior
    );

    currentPartIndex =
      (index + parts.length) % parts.length;

    const part = parts[currentPartIndex];

    document.getElementById("part-title").textContent =
      `${part.id}. ${part.name}`;

    document.getElementById("part-loc").textContent = part.loc;
    document.getElementById("part-func").textContent = part.func;

    document.getElementById("step-counter").textContent =
      `${part.id} / ${parts.length}`;

    for (const [i, item] of pinElements.entries()) {
      const active = i === currentPartIndex;

      item.pin.classList.toggle("active", active);
      item.pin.setAttribute("aria-pressed", String(active));
      item.dot.classList.toggle("active", active);

      item.line.setAttribute(
        "stroke",
        active
          ? (part.id === 1 ? "#0284c7" : "#f97316")
          : "#94a3b8"
      );

      item.line.setAttribute(
        "stroke-width",
        active ? "2.5" : "1.2"
      );

      if (active) {
        item.line.removeAttribute("stroke-dasharray");
      } else {
        item.line.setAttribute("stroke-dasharray", "4 4");
      }
    }

    resize();

    if (!machineRoot) return;

    if (part.requiresInterior) {
      setInterior(true, true);
    } else if (wasInteriorStep && !isExploded) {
      setInterior(false);
    }

    ui();
    highlightPart(part);

    if (fly && !isExploded) {
      focusPart(part);
    }
  }

  function updateCallouts() {
    if (!machineRoot || !pinsVisible) return;

    machineRoot.updateMatrixWorld(true);

    const width = viewport.clientWidth;
    const height = viewport.clientHeight;

    for (const [index, item] of pinElements.entries()) {
      const projected = anchorWorld(item.part).project(camera);

      const anchorX = (projected.x * 0.5 + 0.5) * width;
      const anchorY = (0.5 - projected.y * 0.5) * height;

      const inFrame =
        projected.z >= -1 &&
        projected.z <= 1 &&
        anchorX >= 0 &&
        anchorX <= width &&
        anchorY >= 0 &&
        anchorY <= height;

      item.dot.style.display = inFrame ? "block" : "none";
      item.line.style.display = inFrame ? "block" : "none";
      item.dot.style.left = `${anchorX}px`;
      item.dot.style.top = `${anchorY}px`;

      const pinX =
        24 + index * (width - 48) / (pinElements.length - 1);

      const pinY = 84;

      item.pin.style.left = `${pinX}px`;
      item.pin.style.top = `${pinY}px`;

      item.line.setAttribute("x1", anchorX);
      item.line.setAttribute("y1", anchorY);
      item.line.setAttribute("x2", pinX);
      item.line.setAttribute("y2", pinY);
    }
  }

  btnLid.addEventListener("click", () => {
    setInterior(!isLidOpen);
  });

  btnFlow.addEventListener("click", () => {
    setFlow(!isFlowPlaying);
  });

  btnExplode.addEventListener("click", () => {
    setExploded(!isExploded);
  });

  document
    .getElementById("btn-toggle-pins")
    .addEventListener("click", (event) => {
      pinsVisible = !pinsVisible;

      pinsLayer.style.display = pinsVisible
        ? "block"
        : "none";

      svgLayer.style.display = pinsVisible
        ? "block"
        : "none";

      event.currentTarget.classList.toggle(
        "active",
        !pinsVisible
      );

      event.currentTarget.setAttribute(
        "aria-pressed",
        String(pinsVisible)
      );

      resize();
    });

  document
    .getElementById("btn-prev")
    .addEventListener("click", () => {
      selectPart(currentPartIndex - 1);
    });

  document
    .getElementById("btn-next")
    .addEventListener("click", () => {
      selectPart(currentPartIndex + 1);
    });

  document
    .getElementById("btn-reset-cam")
    .addEventListener("click", () => {
      if (machineRoot) {
        fitCamera(assembledBounds(), [1, 0.65, 1.8]);
      }
    });

  document
    .getElementById("btn-fullscreen")
    .addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          if (container.requestFullscreen) {
            await container.requestFullscreen();
          } else {
            container.webkitRequestFullscreen?.();
          }
        } else {
          await document.exitFullscreen?.();
        }
      } catch (error) {
        console.warn(
          "Pantalla completa no disponible:",
          error.message
        );
      }
    });

  // Selección directa de las piezas sobre el modelo.
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let pointerDown = null;

  renderer.domElement.addEventListener(
    "pointerdown",
    (event) => {
      pointerDown = {
        x: event.clientX,
        y: event.clientY
      };
    }
  );

  renderer.domElement.addEventListener(
    "pointerup",
    (event) => {
      if (
        !machineRoot ||
        !pointerDown ||
        Math.hypot(
          event.clientX - pointerDown.x,
          event.clientY - pointerDown.y
        ) > 6
      ) {
        return;
      }

      pointerDown = null;

      const rect =
        renderer.domElement.getBoundingClientRect();

      pointer.set(
        (event.clientX - rect.left) / rect.width * 2 - 1,
        -(event.clientY - rect.top) / rect.height * 2 + 1
      );

      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObject(
        machineRoot,
        true
      );

      for (const hit of hits) {
        const material = Array.isArray(hit.object.material)
          ? hit.object.material[0]
          : hit.object.material;

        if (
          material?.transparent &&
          material.opacity < 0.2
        ) {
          continue;
        }

        const index = [2, 3, 4, 5, 0, 6, 1].find(
          (i) =>
            roleMeshes[parts[i].role]?.includes(hit.object)
        );

        if (index !== undefined) {
          selectPart(index, true);
          break;
        }
      }
    }
  );

  controls.addEventListener("start", () => {
    camAnim = null;
    cameraFrame = null;
  });

  document
    .getElementById("btn-accordion")
    .addEventListener("click", (event) => {
      const button = event.currentTarget;

      const expanded =
        button.getAttribute("aria-expanded") !== "true";

      button.setAttribute(
        "aria-expanded",
        String(expanded)
      );

      document.getElementById("card-details").hidden =
        !expanded;

      resize();
    });

  function resize() {
    const frame = usableFrame();

    if (!frame.width || !frame.height) return;

    camera.aspect = frame.width / frame.height;

    camera.setViewOffset(
      frame.width,
      frame.height,
      0,
      (frame.bottom - frame.top) / 2,
      frame.width,
      frame.height
    );

    camera.updateProjectionMatrix();

    renderer.setSize(
      frame.width,
      frame.height
    );

    const layout = [
      frame.width,
      frame.height,
      frame.top,
      frame.bottom
    ].join(":");

    if (layout !== lastLayout) {
      lastLayout = layout;

      if (cameraFrame) {
        fitCamera(
          cameraFrame.box,
          cameraFrame.direction,
          !camAnim
        );
      }
    }
  }

  const layoutObserver = new ResizeObserver(resize);
  layoutObserver.observe(viewport);
  layoutObserver.observe(document.querySelector(".bottom-area"));
  layoutObserver.observe(document.querySelector(".header"));

  document.addEventListener("fullscreenchange", resize);
  window.addEventListener("resize", resize);

  resize();
  ui();
  selectPart(0, false);

  const loader = new GLTFLoader();
  const draco = new DRACOLoader();

  draco.setDecoderPath(
    "https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/"
  );

  loader.setDRACOLoader(draco);

  loader.load(
    MODEL_URL,
    (gltf) => {
      try {
        machineRoot = gltf.scene;

        const box = new THREE.Box3().setFromObject(machineRoot);
        const size = box.getSize(new THREE.Vector3());

        machineRoot.scale.setScalar(
          2 / Math.max(size.x, size.y, size.z)
        );

        const scaled =
          new THREE.Box3().setFromObject(machineRoot);

        const center = scaled.getCenter(
          new THREE.Vector3()
        );

        machineRoot.position.set(
          -center.x,
          -scaled.min.y,
          -center.z
        );

        scene.add(machineRoot);
        machineRoot.updateMatrixWorld(true);

        machineRoot.userData.assembledBounds =
          new THREE.Box3().setFromObject(machineRoot);

        addBankShadow(machineRoot.userData.assembledBounds);
        bindParts();

        waterParticles = machineRoot.getObjectByName(
          "Flujo_Agua_Didactico"
        );

        frontPanel = machineRoot.getObjectByName(
          "Panel_Frontal_Desmontable"
        );

        mixer = new THREE.AnimationMixer(machineRoot);

        for (const clip of gltf.animations) {
          actions[clip.name] = mixer.clipAction(clip);
        }

        for (const name of [
          "Funcionamiento_Con_Agua",
          "Vista_Explosionada",
          "Reensamblar",
          "Abrir_Corte_Banco",
          "Cerrar_Corte_Banco"
        ]) {
          if (!actions[name]) {
            throw Error(
              `Falta la animación ${name}. Comprueba que GitHub contiene el último GLB.`
            );
          }
        }

        loadingScreen.classList.add("hidden");

        const panelTrack = actions
          .Abrir_Corte_Banco
          .getClip()
          .tracks
          .find(
            (track) =>
              track.name.endsWith(".position") &&
              track.name.includes("Panel_Frontal_Desmontable")
          );

        if (panelTrack) {
          openPanelPosition = new THREE.Vector3().fromArray(
            panelTrack.values,
            panelTrack.values.length - 3
          );
        }

        selectPart(0, false);
        focusPart(parts[0], true);

        draco.dispose();

        window.__peltonViewer = {
          parts,
          roleMeshes,
          machineRoot,
          mixer,
          actions,
          camera,
          controls,
          selectPart,
          anchorWorld,
          setFlow,
          setInterior,
          setExploded,

          get state() {
            return {
              currentPartIndex,
              isFlowPlaying,
              isLidOpen,
              isExploded,
              pinsVisible
            };
          }
        };

        window.__viewerReady = true;
      } catch (error) {
        showError(error);
      }
    },
    (xhr) => {
      const progress = xhr.lengthComputable
        ? `${Math.round(xhr.loaded / xhr.total * 100)}%`
        : `${(xhr.loaded / 1048576).toFixed(1)} MB`;

      document.querySelector(".loader-text").textContent =
        `Cargando Banco y Turbina 3D… ${progress}`;
    },
    showError
  );

  function showError(error) {
    console.error(error);
    loadingScreen.classList.remove("hidden");

    document.querySelector(".loader-spinner").style.display =
      "none";

    document.querySelector(".loader-text").textContent =
      `No se pudo preparar el visor. ${
        error.message || "Comprueba la conexión con GitHub."
      }`;

    window.__viewerError =
      error.message || String(error);
  }

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(
      clock.getDelta(),
      0.05
    );

    if (mixer) {
      mixer.update(delta);
    }

    // Mantener abierto el frente durante todo el paso 7.
    if (
      frontPanel &&
      openPanelPosition &&
      parts[currentPartIndex].requiresInterior
    ) {
      frontPanel.position.copy(openPanelPosition);
    }

    if (camAnim) {
      camAnim.progress += delta * 2.2;

      const t = Math.min(
        1,
        camAnim.progress
      );

      const ease = 1 - (1 - t) ** 3;

      camera.position.lerpVectors(
        camAnim.startPos,
        camAnim.endPos,
        ease
      );

      controls.target.lerpVectors(
        camAnim.startLook,
        camAnim.endLook,
        ease
      );

      if (t === 1) {
        camAnim = null;
      }
    }

    controls.update();
    renderer.render(scene, camera);
    updateCallouts();
  }

  animate();
</script>
</body>
</html>
